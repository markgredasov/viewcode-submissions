services:
  postgres:
    image: postgres:18.1-bookworm
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/db:/var/lib/postgresql
    restart: always
    ports:
      - "5433:5432"
    networks:
      - viewcode-submissions-network  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viewcode-submissions
    ports:
      - "50051:50051"
    environment:
      - GRPC_ADDR=${GRPC_ADDR}
      - GRPC_SHUTDOWN_TIMEOUT=${GRPC_SHUTDOWN_TIMEOUT}
      - GRPC_ENABLE_REFLECTION=${GRPC_ENABLE_REFLECTION:-true}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - IP_LIMITER_RPS=${IP_LIMITER_RPS}
      - IP_LIMITER_BURST=${IP_LIMITER_BURST}
      - IP_LIMITER_TTL=${IP_LIMITER_TTL}
      - IP_LIMITER_CLEANUP_INTERVAL=${IP_LIMITER_CLEANUP_INTERVAL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - viewcode-submissions-network

networks:
  viewcode-submissions-network:
    driver: bridge
    